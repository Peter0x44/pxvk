# Cross-compiles the 32-bit runtime on Linux and uploads the tester package
# (tools/package.py) as the pxvk-<commit> artifact. There is no GPU here, so
# the GPU tests (tools/check.py, bench.py) are not run.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x86:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.name }}
    # Fedora for a current MinGW GCC that still targets msvcrt.dll like
    # w64devkit (Ubuntu's, even in 26.04, is GCC 13; Arch's targets UCRT).
    container: fedora:latest
    steps:
      # i686-w64-mingw32 (Fedora's mingw32 target). Every target links with
      # -static (CMakeLists.txt), so the binaries import only Windows system
      # DLLs; package.py enforces that.
      - name: Install toolchain
        run: |
          dnf -y install git cmake ninja-build python3 mingw32-gcc-c++ mingw32-winpthreads-static
          i686-w64-mingw32-g++ --version | head -1
          i686-w64-mingw32-g++ -v 2>&1 | grep -E "Thread model|with-default-msvcrt" || true

      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build/x86 -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86
          -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++

      - name: Build
        run: cmake --build build/x86

      - name: Package
        id: package
        shell: bash
        run: |
          # Tags v1.2.3 produce pxvk-1.2.3; everything else pxvk-<commit>.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="pxvk-${GITHUB_REF_NAME#v}"
          else name="pxvk-${GITHUB_SHA::7}"; fi
          python tools/package.py --build build/x86 --out dist --name "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The artifact is the package folder; GitHub serves it as a zip.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}/
          if-no-files-found: error

      # For releases, also keep the zip itself (with its top-level folder).
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: dist/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  # Pushing a tag v1.2.3 publishes a GitHub release with pxvk-1.2.3.zip.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.windows-x86.outputs.package }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$PACKAGE.zip"
          --repo "$GITHUB_REPOSITORY" --title "pxvk ${GITHUB_REF_NAME#v}" --generate-notes
